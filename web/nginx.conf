server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Health check for web container
    location /health {
        default_type application/json;
        return 200 '{"status":"ok","service":"web","version":"0.1.0"}';
    }

    location /api/version {
        default_type application/json;
        return 200 '{"version":"0.1.0","system":"second-brain"}';
    }

    # Proxy to Curator service
    location /api/curator/ {
        proxy_pass http://curator:8001/api/curator/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy to Brain service
    location /api/brain/ {
        proxy_pass http://brain:8002/api/brain/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy to Statistics service
    location /api/stats/ {
        proxy_pass http://statistics:8003/api/stats/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
